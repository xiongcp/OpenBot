[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbot"
version = "0.1.0.dev0"
description = "OpenBot local control plane (implementation in progress)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pydantic==2.12.5",
  "rfc8785==0.1.4",
  "rfc3339-validator==0.1.4",
]

[project.scripts]
openbot = "openbot.cli:main"

[dependency-groups]
dev-contracts = ["pytest==8.4.2", "ruff==0.14.10", "mypy==1.19.1", "types-jsonschema==4.26.0.20260202"]
provider-openai = ["openai==2.26.0", "httpx==0.28.1"]

[tool.uv]
default-groups = ["dev-contracts"]

[tool.setuptools.packages.find]
where = ["services/core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = [".", "services/core/src", "services/feishu_gateway/src"]
markers = [
  "sdk: actual optional SDK against synthetic loopback HTTP",
  "native_container: explicitly enabled Docker Desktop synthetic isolation PoC",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["services/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["services/core/src/openbot", "services/feishu_gateway/src/openbot_feishu"]
strict = true
