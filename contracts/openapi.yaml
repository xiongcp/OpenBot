{
  "openapi": "3.1.0",
  "info": {
    "title": "OpenBot Local Control API",
    "version": "1.1.0",
    "description": "Design contract, not an implemented service. Bind loopback only. Server derives principal/profile from authentication; never accept client role flags."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:{port}",
      "variables": {
        "port": {
          "default": "8765",
          "description": "Development example only. Production negotiates a daemon-bound port securely."
        }
      }
    }
  ],
  "security": [
    {
      "LocalBearer": []
    }
  ],
  "paths": {
    "/v1/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Get minimal authenticated health",
        "responses": {
          "200": {
            "description": "Readiness",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "enum": [
                        "READY",
                        "DEGRADED",
                        "RECOVERING",
                        "STOPPING"
                      ]
                    },
                    "version": {
                      "type": "string"
                    },
                    "protocol_version": {
                      "const": "1.1"
                    },
                    "capabilities": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  },
                  "required": [
                    "status",
                    "version",
                    "protocol_version",
                    "capabilities"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/tasks": {
      "post": {
        "operationId": "createTask",
        "summary": "Create a durable task idempotently",
        "responses": {
          "200": {
            "description": "New or existing task",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./task.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 200
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./create-task.schema.json"
              }
            }
          }
        }
      }
    },
    "/v1/tasks/{task_id}": {
      "parameters": [
        {
          "name": "task_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "get": {
        "operationId": "getTask",
        "summary": "Get authoritative task snapshot",
        "responses": {
          "200": {
            "description": "Task",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./task.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/tasks/{task_id}/cancel": {
      "parameters": [
        {
          "name": "task_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "post": {
        "operationId": "cancelTask",
        "summary": "Request cancellation; does not roll back effects",
        "responses": {
          "200": {
            "description": "Cancellation requested or already terminal",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "task_id": {
                      "type": "string",
                      "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
                    },
                    "state": {
                      "$ref": "./common.schema.json#/$defs/TaskState"
                    },
                    "version": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "accepted": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "task_id",
                    "state",
                    "version",
                    "accepted"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "reason": {
                    "type": "string",
                    "maxLength": 1000
                  }
                },
                "required": [],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/v1/tasks/{task_id}/resume": {
      "parameters": [
        {
          "name": "task_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "post": {
        "operationId": "resumeTask",
        "summary": "Resume only after preflight rechecks",
        "responses": {
          "200": {
            "description": "Resume accepted",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "task_id": {
                      "type": "string",
                      "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
                    },
                    "state": {
                      "$ref": "./common.schema.json#/$defs/TaskState"
                    },
                    "version": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "accepted": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "task_id",
                    "state",
                    "version",
                    "accepted"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "expected_version": {
                    "type": "integer",
                    "minimum": 1
                  }
                },
                "required": [
                  "expected_version"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/v1/events": {
      "get": {
        "operationId": "subscribeEvents",
        "summary": "Durable SSE stream ordered by seq",
        "parameters": [
          {
            "name": "after_seq",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "text/event-stream; id is seq, data is runtime-event.schema.json",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "410": {
            "description": "Cursor is no longer retained; fetch snapshot then resubscribe",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./common.schema.json#/$defs/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/approvals/{approval_id}": {
      "parameters": [
        {
          "name": "approval_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "get": {
        "operationId": "getApproval",
        "summary": "Get owner-scoped immutable approval preview",
        "responses": {
          "200": {
            "description": "Filtered immutable approval preview, never an internal ToolProposal",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./approval-preview.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/approvals/{approval_id}/decisions": {
      "parameters": [
        {
          "name": "approval_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "post": {
        "operationId": "decideApproval",
        "summary": "Derive actor from authentication and perform approval CAS",
        "responses": {
          "200": {
            "description": "Authoritative decision",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "approval_id": {
                      "type": "string",
                      "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
                    },
                    "status": {
                      "$ref": "./common.schema.json#/$defs/ApprovalState"
                    },
                    "operation_id": {
                      "type": "string",
                      "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
                    },
                    "version": {
                      "type": "integer",
                      "minimum": 1
                    }
                  },
                  "required": [
                    "approval_id",
                    "status",
                    "operation_id",
                    "version"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./approval-decision.schema.json"
              }
            }
          }
        }
      }
    },
    "/v1/artifacts/{artifact_id}": {
      "parameters": [
        {
          "name": "artifact_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "get": {
        "operationId": "getArtifact",
        "summary": "Download authorized immutable artifact",
        "responses": {
          "200": {
            "description": "Artifact bytes; safe Content-Disposition attachment and nosniff",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/capabilities": {
      "get": {
        "operationId": "getCapabilities",
        "summary": "Get available and blocked platform capabilities",
        "responses": {
          "200": {
            "description": "Capabilities",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "available": {
                        "type": "boolean"
                      },
                      "reason": {
                        "type": [
                          "string",
                          "null"
                        ]
                      }
                    },
                    "required": [
                      "name",
                      "available",
                      "reason"
                    ],
                    "additionalProperties": false
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/reconciliations/{operation_id}": {
      "parameters": [
        {
          "name": "operation_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{3,95}$"
          }
        }
      ],
      "post": {
        "operationId": "reconcileOperation",
        "summary": "Record evidence for unknown effect; never blanket retry",
        "responses": {
          "200": {
            "description": "Operation snapshot; KEEP_UNKNOWN never dispatches",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./operation-snapshot.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "./reconciliation.schema.json"
              }
            }
          }
        }
      }
    },
    "/v1/approvals/{approval_id}/challenge": {
      "parameters": [
        {
          "name": "approval_id",
          "in": "path",
          "required": true,
          "schema": {
            "$ref": "./common.schema.json#/$defs/Id"
          }
        }
      ],
      "post": {
        "operationId": "getApprovalChallenge",
        "summary": "Local authenticated owner only; gateway tokens excluded; pending approvals only",
        "responses": {
          "200": {
            "description": "Authoritative filtered result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "approval_id": {
                      "$ref": "./common.schema.json#/$defs/Id"
                    },
                    "nonce": {
                      "type": "string",
                      "minLength": 32,
                      "maxLength": 256
                    },
                    "expires_at_ms": {
                      "$ref": "./common.schema.json#/$defs/UtcMs"
                    },
                    "binding_hash": {
                      "$ref": "./common.schema.json#/$defs/Hash"
                    }
                  },
                  "required": [
                    "approval_id",
                    "nonce",
                    "expires_at_ms",
                    "binding_hash"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {},
                "required": [],
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
    "/v1/operations/{operation_id}": {
      "parameters": [
        {
          "name": "operation_id",
          "in": "path",
          "required": true,
          "schema": {
            "$ref": "./common.schema.json#/$defs/Id"
          }
        }
      ],
      "get": {
        "operationId": "getOperation",
        "summary": "Get filtered operation snapshot and authoritative Operation.version",
        "responses": {
          "200": {
            "description": "Authoritative filtered result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./operation-snapshot.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/v1/artifacts/import": {
      "post": {
        "operationId": "importArtifact",
        "summary": "Local user import of bounded evidence bytes; never accept arbitrary host paths",
        "responses": {
          "200": {
            "description": "Authoritative filtered result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "artifact_id": {
                      "$ref": "./common.schema.json#/$defs/Id"
                    },
                    "sha256": {
                      "$ref": "./common.schema.json#/$defs/Hash"
                    },
                    "size_bytes": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "data_class": {
                      "$ref": "./common.schema.json#/$defs/DataClass"
                    }
                  },
                  "required": [
                    "artifact_id",
                    "sha256",
                    "size_bytes",
                    "data_class"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  },
                  "task_id": {
                    "$ref": "./common.schema.json#/$defs/Id"
                  },
                  "purpose": {
                    "enum": [
                      "TASK_ATTACHMENT",
                      "RECONCILIATION_EVIDENCE"
                    ]
                  }
                },
                "required": [
                  "file",
                  "task_id",
                  "purpose"
                ],
                "additionalProperties": false
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "LocalBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Per-profile scoped token. No tokens in query strings or renderer assets."
      }
    },
    "responses": {
      "Error": {
        "description": "Structured error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "./common.schema.json#/$defs/Error"
            }
          }
        }
      }
    }
  }
}
