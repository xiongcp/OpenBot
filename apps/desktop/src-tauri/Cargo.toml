[package]
name = "openbot-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "openbot_desktop"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tauri = "=2.12.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[build-dependencies]
tauri-build = "=2.7.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
