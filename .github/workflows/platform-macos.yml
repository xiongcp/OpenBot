name: platform-macos
on:
  push:
    branches: [main, 'release/**', 'v1.*', mvp/macos-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: uv python install 3.12.12
      - run: uv sync --locked --python 3.12.12
      - name: Record macOS runner and locked toolchain identity
        run: |
          sw_vers
          uname -m
          shasum -a 256 uv.lock
          .venv/bin/python -c "import sys, platform; print(sys.version); print(platform.system(), platform.machine())"
      - name: Run macOS ARM64 native platform gate
        run: |
          .venv/bin/python -m pytest tests/integration/platform/macos/test_macos_native_gate.py -q
