name: pr-gate
on:
  push:
    branches: [mvp/macos-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-security:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: uv python install 3.12.12
      - run: uv sync --locked --python 3.12.12
      - name: Run M0/M1 contracts, storage, and security threat regression
        run: .venv/bin/python scripts/verify.py
