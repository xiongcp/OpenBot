name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  minimal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: uv python install 3.12.12
      - run: uv sync --locked --python 3.12.12
      - run: uv run --no-sync python -c "import sys, platform, sqlite3; print(sys.version); print(platform.system(), platform.machine()); print(sqlite3.sqlite_version)"
      - run: uv run --no-sync openbot version
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --collect-only -q
      - if: matrix.os == 'macos-15'
        run: |
          uv run --no-sync pytest
          uv run --no-sync python scripts/check_components.py
      - if: matrix.os == 'ubuntu-24.04'
        run: uv run --no-sync pytest --ignore=tests/integration/platform/macos -k "not test_real_minimal_environment_matches_admission"
      - if: matrix.os == 'windows-2022'
        run: uv run --no-sync pytest tests/contracts
      - run: uv run --no-sync python validation/verify_design.py
      - run: uv run --no-sync python validation/verify_components.py
      - run: uv run --no-sync python validation/verify_database.py
