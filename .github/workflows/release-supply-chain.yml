name: release-gate
on:
  push:
    branches: [main, 'release/**', 'v1.*', mvp/macos-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supply-chain-and-bundle-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: uv python install 3.12.12
      - run: uv sync --locked --python 3.12.12
      - name: Verify SPDX SBOM, notices, and checksums
        run: .venv/bin/python scripts/check_release_components.py
